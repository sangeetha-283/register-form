<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>

<body style="background-color: rgb(119, 119, 236);">
    <div
        style="border-radius: 10px; padding: 20px; margin-top: 100px; margin-left: 400px; background-color: antiquewhite; width: 400px; height: 300px;">
        <h1 style="text-align: center;">Create Account</h1>
        <form action="#">
            <table>
                <tr>
                    <td><label for="name">Name</label></td>
                </tr>
                <tr>
                    <td>
                        <input type="text" placeholder="Enter name" id="name" name="name">
                    </td>
                </tr>
                <tr>
                    <td><label for="email">Email</label></td>
                </tr>
                <tr>
                    <td>
                        <input type="email" id="email" placeholder="Enter email" name="email">
                    </td>
                </tr>
                <tr>
                    <td><label for="password">Password</label></td>
                </tr>
                <tr>
                    <td><input type="password" id="password" placeholder="Enter password" name="password"></td>
                </tr>
                <tr>
                    <td><button id="btn"
                            style="border: none; border-radius: 5px; background-color: rgb(30, 30, 66); color: white; padding: 5px; width: 100px;">Submit</button>
                    </td>
                </tr>
            </table>
        </form>
    </div>


    <script>
        var username = document.getElementById("name");
        var email = document.getElementById("email");
        var password = document.getElementById("password");
        var btn = document.getElementById("btn");

        btn.addEventListener("click", function (event) {
            event.preventDefault(); // stop form before submitting

            //regex pattern
            var namePattern = /^[A-Za-z ]+$/; // only letters and spaces
            var emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
            var passwordPattern = /^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;


            if (username.value === "") {
                alert("Please enter your name");
            }
            else if (!username.value.match(namePattern)) {
                alert("Name should contain only letters (A–Z or a–z)");
            }
            else if (!email.value.match(emailPattern)) {
                alert("Please enter a valid email address");
            }
            else if (!password.value.match(passwordPattern)) {
                alert("Password must be at least 8 characters long, include a number, a special character, and an uppercase letter");
            }
            else {
                alert("Form submitted successfully!");
            }
        });
    </script>
</body>
</html>
